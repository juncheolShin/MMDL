# Copy this file for a new experiment. Paths and run names stay on the command line.
[evaluation]
temperature = 0.0
top_p = 0.8
top_k = 20
repetition_penalty = 1.0
presence_penalty = 1.5
seed = 0
max_new_tokens = 2048
max_model_len = 8192
min_pixels = 262144
max_pixels = 2097152
gpu_memory_utilization = 0.85
max_num_seqs = 2
tensor_parallel_size = 1
max_images_per_prompt = 10

[training]
epochs = 1.0
learning_rate = 0.0001
gradient_accumulation_steps = 8
per_device_train_batch_size = 1
lora_r = 8
lora_alpha = 16
lora_dropout = 0.0
max_steps = -1
min_pixels = 65536
max_pixels = 524288
model_max_length = 2048

# Added 2026-11-26. code/train/train_lora.py now passes these three to the
# upstream trainer on every run, so configuration.py requires them. The values
# below are what this config's runs were ALREADY getting implicitly, so nothing
# about the RTX 4090 baseline changes:
#   seed 42 was HuggingFace's default while the flag went unpassed
#   the other two are the upstream TrainingArguments defaults
# A 24GB card that OOMs should set gradient_checkpointing = true (about 30%
# slower); the H200 arm configs in configs/arms/ keep it false on purpose.
seed = 42
gradient_checkpointing = false
dataloader_num_workers = 0
