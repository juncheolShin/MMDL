# THROUGHPUT PROFILE of arm A. Not an experiment run - never report its loss.
#
# The first smoke test did 2 optimizer steps in 362s (183 s/step). For 32
# sequences of 2048 tokens on a 4B model that is ~1.6 PFLOP, which an H200 should
# finish in about 5s even at 30% utilisation - an MFU of roughly 0.25%.
#
# diagnose_throughput.py ruled out the two obvious causes: Lustre reads cost
# 0.93 ms/image and PIL decode 3.4 ms/image, so loading 32 images is under 0.2s
# of a 183s step. What was left was the MISSING C COMPILER - the base image has
# no cc/gcc/g++/clang, so Triton could never compile a kernel and torch fell back
# to a slow path without failing. vLLM died outright on it; training only crawled.
# conda-forge gcc 16.2.0 is now installed and CC/CXX/TRITON_CACHE_DIR are in
# mmdl.env, so this re-measures with the compiler in place.
#
# 8 steps rather than 2: step 1 carries compilation and warmup, so a 2-step run
# cannot separate one-off cost from steady state. Read the per-step time from the
# last few steps, not the average.
# arm A - language LoRA (attn+MLP), answer-only targets
# H200 profile. Copy this file for a new experiment; paths and run names stay on
# the command line. Values verified against measured module names (probe job,
# 2026-11-19) and the parameter counts in DECISIONS.md section 2.
[training]
epochs = 1.0
learning_rate = 0.0001
gradient_accumulation_steps = 4        # SMOKE on 1 GPU: 1 x 8 x 4 = global 32
per_device_train_batch_size = 8        # H200 141GB; the 4090 profile used 1
lora_r = 64                            # D43: arm A/B 132.12M vs arm C1 109.11M
lora_alpha = 128
lora_dropout = 0.0                     # upstream turned this into 0.05; patched
max_steps = 8                           # PROFILE: enough steps for a steady-state figure
min_pixels = 65536
max_pixels = 524288
model_max_length = 2048
seed = 0
gradient_checkpointing = false         # 141GB: no need to recompute (~30% faster)
dataloader_num_workers = 4             # pod limit is 8 CPU, not the 128 nproc reports

[trainable]
arm = "a"
llm_lora = true
llm_lora_targets = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
vision_lora_blocks = []
vision_lora_targets = []
train_adapters = false
